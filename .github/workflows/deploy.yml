name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-academy-production
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.bwaveedu.com/api' }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://bwaveedu.com' }}
  NEXT_PUBLIC_BASE_API_URL_CLIENT: ${{ vars.NEXT_PUBLIC_BASE_API_URL_CLIENT || 'https://api.bwaveedu.com/api' }}
  NEXT_PUBLIC_BASE_API_URL_SERVER: ${{ vars.NEXT_PUBLIC_BASE_API_URL_SERVER || 'https://api.bwaveedu.com' }}
  NEXT_PUBLIC_BASE_IMAGE_URL: ${{ vars.NEXT_PUBLIC_BASE_IMAGE_URL || 'https://api.bwaveedu.com' }}
  NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'https://bwaveedu.com' }}
  NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_ENV: development

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Prepare standalone bundle
        run: |
          chmod +x scripts/prepare-standalone.sh scripts/server-deploy.sh
          ./scripts/prepare-standalone.sh
          cp ecosystem.config.cjs .next/standalone/ecosystem.config.cjs
          mkdir -p .next/standalone/_ci
          cp scripts/server-deploy.sh .next/standalone/_ci/server-deploy.sh
          tar -czf academy-release.tar.gz -C .next/standalone .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: academy-release
          path: academy-release.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_PORT: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
    steps:
      - name: Validate deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required secret: $key" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add secrets under Settings → Secrets and variables → Actions" >&2
            exit 1
          fi
          echo "Deploy target: ${SSH_USER}@${SSH_HOST}:${{ env.SSH_PORT }} → ${DEPLOY_PATH}"

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: academy-release

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -eo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            mkdir -p "$DEPLOY_PATH/releases"
            touch "$DEPLOY_PATH/.deploy-ready"
            echo "Deploy path ready: $DEPLOY_PATH"

      - name: Upload tarball to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: academy-release.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Extract and reload PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -eo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            mkdir -p releases
            RELEASE_DIR="releases/$(date +%Y%m%d%H%M%S)-${{ github.sha }}"
            mkdir -p "$RELEASE_DIR"
            tar -xzf academy-release.tar.gz -C "$RELEASE_DIR"
            rm -f academy-release.tar.gz
            if [[ -f .env ]]; then
              cp .env "$RELEASE_DIR/.env"
            else
              echo "::warning::No .env in $DEPLOY_PATH — create one before going live (see DEPLOY.md)"
            fi
            ln -sfn "$RELEASE_DIR" current
            cd current
            if [[ ! -f server.js ]] || [[ ! -f .next/BUILD_ID ]]; then
              echo "Standalone release is incomplete (need server.js and .next/BUILD_ID)" >&2
              ls -la .next 2>/dev/null || true
              exit 1
            fi
            for old in bwe-acad bwe-academy brainwave-academy nex-js-2024; do
              bash _ci/server-deploy.sh delete "$old" 2>/dev/null || true
            done
            bash _ci/server-deploy.sh start ecosystem.config.cjs --env production --update-env
            bash _ci/server-deploy.sh save
            ls -dt releases/* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true
            echo "Deployed $(basename "$RELEASE_DIR") — listening on port 3004"
