name: brain-wave-education

services:
  brainwave-academy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:1337/api}
    container_name: brain-wave-academy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bwaveedu.com}
      NEXT_PUBLIC_BASE_API_URL: ${NEXT_PUBLIC_BASE_API_URL:-http://localhost:1337/api}
      NEXT_PUBLIC_BASE_IMAGE_URL: ${NEXT_PUBLIC_BASE_IMAGE_URL:-http://localhost:1337}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:1337/api}
      JWT_SECRET: ${JWT_SECRET:-MY_TOKEN_SECRET_KEY}
      MONGODB_URI: ${MONGODB_URI:-mongodb://localhost:27017/}
    ports:
      - "3004:3000"
    restart: unless-stopped
